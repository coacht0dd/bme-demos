<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Building Ideas — Precision | Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#191D1C}
a{color:#F0A3A7}a:hover{color:#FFFFFF}
.page{font-family:'Archivo',system-ui,sans-serif;color:#EEF0EF;background:#191D1C;min-width:0}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px;box-sizing:border-box}
.wide{font-stretch:125%}
.sec{padding:88px 0}
.light{background:#EEF0EF;color:#191D1C}
.light a{color:#8E1D24}
.mid{background:#232928}
.h2{margin:0;font-size:40px;line-height:1.04;font-weight:900;text-transform:uppercase;font-stretch:125%}
.lead{margin:0;font-size:17px;line-height:1.6;color:#BCC3C1}
.light .lead{color:#3D4544}
.btn{display:inline-block;background:#A3222A;color:#FFFFFF;text-decoration:none;font-weight:700;padding:16px 24px;border-radius:2px;font-size:16px}
.btn:hover{background:#821A21;color:#FFFFFF}
.btn2{display:inline-block;border:1px solid #EEF0EF;color:#EEF0EF;text-decoration:none;font-weight:600;padding:15px 22px;border-radius:2px;font-size:16px}
.card{background:#232928;border:1px solid #343B3A}
.light .card{background:#FFFFFF;border:1px solid #C3C9C7}
.in{padding:13px;background:#232928;border:1px solid #4A5251;color:#EEF0EF;font-size:16px;border-radius:2px}
.lab{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
summary{cursor:pointer;font-weight:700;font-size:18px;padding:20px 0}
input,select,textarea{font:inherit}
</style>
<script src="assets/dc-lite.js" defer></script>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="dc-template">
<div class="page">

<div style="background: #A3222A; color: #FFFFFF; font-size: 14px">
<div class="wrap" style="padding-top: 9px; padding-bottom: 9px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; justify-content: space-between">
<span>{{t.topbar}} <a href="tel:+14047719004" style="color: #FFFFFF; font-weight: 800">{{t.callText}}</a></span>
<div role="group" aria-label="Language" style="display: flex; border: 1px solid rgba(255,255,255,0.6)">
<button type="button" onClick="{{setEn}}" aria-pressed="{{isEn}}" style="{{enBtn}}">EN</button>
<button type="button" onClick="{{setEs}}" aria-pressed="{{isEs}}" style="{{esBtn}}">ES</button>
</div>
</div>
</div>

<header style="position: sticky; top: 0; z-index: 20; background: #191D1C; border-bottom: 1px solid #343B3A">
<div class="wrap" style="padding-top: 14px; padding-bottom: 14px; display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: center; justify-content: space-between">
<a href="#top" aria-label="Building Ideas home" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #FFFFFF">
<svg width="38" height="38" viewBox="0 0 100 100" aria-hidden="true"><polygon points="0,22 22,0 22,48 0,48" fill="#C9333B"></polygon><polygon points="0,52 22,52 22,78 0,100" fill="#C9333B"></polygon><path d="M28 0H76L98 24L76 48H28ZM42 16V32H70L78 24L70 16Z" fill="#FFFFFF" fill-rule="evenodd"></path><path d="M28 52H80L100 76L80 100H28ZM42 68V84H74L82 76L74 68Z" fill="#FFFFFF" fill-rule="evenodd"></path></svg>
<span class="wide" style="font-weight: 900; font-size: 21px">BUILDING IDEAS</span>
</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 6px 24px; font-size: 15px; font-weight: 500">
<a href="#services" style="color: #EEF0EF; text-decoration: none">{{t.navServices}}</a>
<a href="#work" style="color: #EEF0EF; text-decoration: none">{{t.navWork}}</a>
<a href="#about" style="color: #EEF0EF; text-decoration: none">{{t.navAbout}}</a>
<a href="#area" style="color: #EEF0EF; text-decoration: none">{{t.navArea}}</a>
<a href="#contact" style="color: #EEF0EF; text-decoration: none">{{t.navContact}}</a>
</nav>
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
<a href="tel:+14047719004" style="color: #FFFFFF; font-weight: 700; text-decoration: none">404-771-9004</a>
<a href="#contact" class="btn">{{t.ctaBook}}</a>
</div>
</div>
</header>

<section id="top" style="position: relative; overflow: hidden">
<img src="images/aerial-framing.jpg" alt="Aerial view of a second-story addition being framed" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: block">
<div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(25,29,28,0.72)"></div>
<div class="wrap" style="position: relative; padding-top: 136px; padding-bottom: 120px; display: flex; flex-direction: column; gap: 28px">
<h1 class="wide" style="margin: 0; font-size: 72px; line-height: 0.98; font-weight: 900; text-transform: uppercase; max-width: 1080px">{{t.heroA}} <span style="color: #F0A3A7">{{t.heroB}}</span></h1>
<p style="margin: 0; font-size: 20px; line-height: 1.55; color: #D5DAD8; max-width: 640px">{{t.heroSub}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<a href="tel:+14047719004" class="btn">{{t.ctaCall}}</a>
<a href="#contact" class="btn2">{{t.ctaBook}}</a>
</div>
<p style="margin: 0; font-size: 15px; color: #BCC3C1">{{t.heroCred}}</p>
</div>
</section>

<section aria-label="Why homeowners choose us" style="border-bottom: 1px solid #343B3A">
<div class="wrap" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0">
<sc-for list="{{t.trust}}" as="item" hint-placeholder-count="4">
<div style="padding: 26px 20px 26px 0; display: flex; flex-direction: column; gap: 4px">
<div class="wide" style="font-weight: 900; font-size: 19px; text-transform: uppercase; color: #F0A3A7">{{item.a}}</div>
<div style="font-size: 15px; color: #BCC3C1">{{item.b}}</div>
</div>
</sc-for>
</div>
</section>

<div aria-label="Areas we serve" class="mid" style="overflow: hidden; white-space: nowrap">
<div class="wrap wide" style="padding-top: 14px; padding-bottom: 14px; display: flex; gap: 32px; font-weight: 800; font-size: 15px; text-transform: uppercase">
<sc-for list="{{areas}}" as="a" hint-placeholder-count="6"><span>{{a}}</span></sc-for>
</div>
</div>

<section id="services" class="sec light">
<div class="wrap" style="display: flex; flex-direction: column; gap: 40px">
<h2 class="h2" style="max-width: 860px">{{t.svcTitle}}</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 0; border-top: 2px solid #191D1C">
<sc-for list="{{services}}" as="item" hint-placeholder-count="6">
<article style="padding: 28px 24px 32px 0; border-bottom: 1px solid #C3C9C7; display: flex; flex-direction: column; gap: 12px">
<img src="{{item.img}}" alt="{{item.title}}" style="width: 100%; height: 190px; object-fit: cover; display: block">
<div class="wide" style="font-size: 14px; font-weight: 900; color: #8E1D24">{{item.n}}</div>
<h3 style="margin: 0; font-size: 22px; font-weight: 800">{{item.title}}</h3>
<p class="lead">{{item.body}}</p>
<a href="#services" style="font-weight: 700; font-size: 15px">{{t.svcLink}} →</a>
</article>
</sc-for>
</div>
</div>
</section>

<section id="work" class="sec">
<div class="wrap" style="display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between">
<h2 class="h2">{{t.workTitle}}</h2>
<a href="#work" style="font-weight: 700">{{t.workAll}} →</a>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px">
<sc-for list="{{work}}" as="w" hint-placeholder-count="6">
<a href="#work" style="text-decoration: none; color: #EEF0EF; display: flex; flex-direction: column; gap: 12px">
<img src="{{w.img}}" alt="{{w.name}}" style="width: 100%; height: 260px; object-fit: cover; display: block">
<span style="display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid #343B3A; padding-top: 10px"><span style="font-weight: 700; font-size: 17px">{{w.name}}</span><span style="font-size: 14px; color: #A9B1AF">{{w.tag}}</span></span>
</a>
</sc-for>
</div>
</div>
</section>

<section id="about" class="sec mid">
<div class="wrap" style="display: flex; flex-wrap: wrap; gap: 48px; align-items: center">
<div style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
<h2 class="h2">{{t.aboutTitle}}</h2>
<p class="lead" style="font-size: 18px">{{t.aboutBody}}</p>
<p style="margin: 0; font-size: 16px; color: #F0A3A7">{{t.aboutStory}}</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
<sc-for list="{{t.team}}" as="m" hint-placeholder-count="4"><div style="border-top: 1px solid #4A5251; padding-top: 10px"><div style="font-weight: 700">{{m.name}}</div><div style="font-size: 14px; color: #A9B1AF">{{m.role}}</div></div></sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{t.creds}}" as="c" hint-placeholder-count="4"><span style="border: 1px solid #4A5251; padding: 6px 12px; font-size: 14px">{{c}}</span></sc-for></div>
</div>
<img src="images/crew-stone-fireplace.jpg" alt="Building Ideas crew installing a two-story stone fireplace" style="flex: 1 1 360px; min-width: 0; width: 100%; height: 520px; object-fit: cover; display: block">
</div>
</section>

<section id="area" class="sec">
<div class="wrap" style="display: flex; flex-wrap: wrap; gap: 40px; align-items: center">
<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<h2 class="h2">{{t.areaTitle}}</h2>
<p class="lead">{{t.areaBody}}</p>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{areas}}" as="a" hint-placeholder-count="6"><li><a href="#area" class="card" style="display: block; padding: 11px 16px; color: #EEF0EF; text-decoration: none; font-weight: 700">{{a}}</a></li></sc-for></ul>
<p style="margin: 0; font-size: 15px; color: #A9B1AF">{{t.areaRadius}}</p>
</div>
<div class="card" style="flex: 1 1 460px; min-width: 0; height: 380px; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 40px), repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 40px); text-align: center; color: #BCC3C1; font-weight: 600">{{t.mapLabel}}</div>
</div>
</section>

<section aria-label="Reviews" class="sec light">
<div class="wrap" style="display: flex; flex-direction: column; gap: 32px">
<h2 class="h2">{{t.revTitle}}</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px">
<sc-for list="{{t.reviews}}" as="r" hint-placeholder-count="3">
<figure class="card" style="margin: 0; padding: 30px; display: flex; flex-direction: column; gap: 14px; border-top: 3px solid #A3222A">
<blockquote style="margin: 0; font-size: 18px; line-height: 1.55">{{r.q}}</blockquote>
<figcaption style="font-weight: 700; color: #3D4544">{{r.who}}</figcaption>
</figure>
</sc-for>
</div>
<a href="#top" style="font-weight: 700">{{t.revNote}} →</a>
</div>
</section>

<section id="plans" class="sec">
<div class="wrap" style="display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-direction: column; gap: 10px; max-width: 700px"><h2 class="h2">{{t.plansTitle}}</h2><p class="lead">{{t.plansSub}}</p></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px">
<sc-for list="{{plans}}" as="p" hint-placeholder-count="3">
<article style="{{p.box}}">
<sc-if value="{{p.featured}}" hint-placeholder-val="{{false}}"><span class="wide" style="font-size: 12px; font-weight: 900; text-transform: uppercase; color: #F0A3A7">{{t.featLabel}}</span></sc-if>
<h3 class="wide" style="margin: 0; font-size: 22px; font-weight: 900; text-transform: uppercase">{{p.name}}</h3>
<div class="wide" style="font-size: 32px; font-weight: 900">{{p.price}}</div>
<p class="lead">{{p.body}}</p>
<ul style="margin: 0; padding-left: 20px; font-size: 15px; line-height: 1.8; color: #D5DAD8"><sc-for list="{{p.points}}" as="pt" hint-placeholder-count="3"><li>{{pt}}</li></sc-for></ul>
<a href="#contact" class="btn" style="margin-top: auto; text-align: center">{{p.cta}}</a>
</article>
</sc-for>
</div>
<p style="margin: 0; font-size: 14px; color: #A9B1AF">{{t.plansNote}}</p>
</div>
</section>

<section id="partners" class="sec mid">
<div class="wrap" style="display: flex; flex-direction: column; gap: 28px">
<h2 class="h2">{{t.partTitle}}</h2>
<div role="tablist" aria-label="{{t.partTitle}}" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{tabs}}" as="tab" hint-placeholder-count="4"><button type="button" role="tab" aria-selected="{{tab.active}}" onClick="{{tab.pick}}" style="{{tab.style}}">{{tab.label}}</button></sc-for>
</div>
<div role="tabpanel" style="display: flex; flex-wrap: wrap; gap: 32px; background: #191D1C; border: 1px solid #343B3A; padding: 36px">
<div style="flex: 1 1 400px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<h3 style="margin: 0; font-size: 26px; font-weight: 800">{{panel.title}}</h3>
<p class="lead">{{panel.body}}</p>
<a href="#contact" class="btn" style="align-self: flex-start">{{panel.cta}}</a>
</div>
<img src="{{panelImg}}" alt="{{panel.title}}" style="flex: 1 1 360px; min-width: 0; width: 100%; height: 280px; object-fit: cover; display: block">
</div>
</div>
</section>

<section aria-label="Free guide" style="background: #A3222A">
<div class="wrap" style="padding-top: 52px; padding-bottom: 52px; display: flex; flex-wrap: wrap; gap: 24px 40px; align-items: center; justify-content: space-between">
<div style="display: flex; gap: 24px; align-items: center; flex: 1 1 520px; min-width: 0">
<div class="wide" style="width: 96px; height: 124px; flex-shrink: 0; background: #191D1C; display: flex; align-items: flex-end; padding: 10px; box-sizing: border-box; font-size: 11px; font-weight: 900; text-transform: uppercase; line-height: 1.2">{{t.magTitle}}</div>
<div style="display: flex; flex-direction: column; gap: 8px"><h2 class="wide" style="margin: 0; font-size: 26px; font-weight: 900; text-transform: uppercase">{{t.magTitle}}</h2><p style="margin: 0; font-size: 16px; line-height: 1.55; color: #FBE3E4">{{t.magBody}}</p><span style="font-size: 13px; color: #FBE3E4">{{t.magNote}}</span></div>
</div>
<a href="#top" style="background: #FFFFFF; color: #191D1C; text-decoration: none; font-weight: 800; padding: 16px 24px; border-radius: 2px">{{t.magCta}}</a>
</div>
</section>

<section aria-label="Questions" class="sec light">
<div class="wrap" style="display: flex; flex-wrap: wrap; gap: 40px">
<h2 class="h2" style="flex: 1 1 320px; min-width: 0">{{t.faqTitle}}</h2>
<div style="flex: 2 1 560px; min-width: 0; border-top: 2px solid #191D1C">
<sc-for list="{{t.faq}}" as="f" hint-placeholder-count="5"><details style="border-bottom: 1px solid #C3C9C7"><summary>{{f.q}}</summary><p class="lead" style="padding-bottom: 20px">{{f.a}}</p></details></sc-for>
</div>
</div>
</section>

<section aria-label="Tips" class="sec">
<div class="wrap" style="display: flex; flex-direction: column; gap: 28px">
<h2 class="h2">{{t.blogTitle}}</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px">
<sc-for list="{{blog}}" as="b" hint-placeholder-count="3">
<a href="#top" class="card" style="text-decoration: none; color: #EEF0EF; display: flex; flex-direction: column">
<img src="{{b.img}}" alt="{{b.title}}" style="width: 100%; height: 180px; object-fit: cover; display: block">
<span style="padding: 20px; display: flex; flex-direction: column; gap: 8px"><span class="wide" style="font-size: 12px; font-weight: 900; text-transform: uppercase; color: #F0A3A7">{{b.tag}}</span><span style="font-size: 19px; font-weight: 700; line-height: 1.3">{{b.title}}</span></span>
</a>
</sc-for>
</div>
<p style="margin: 0; font-size: 14px; color: #A9B1AF">{{t.blogNote}}</p>
</div>
</section>

<section id="contact" class="sec mid">
<div class="wrap" style="display: flex; flex-wrap: wrap; gap: 48px">
<div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
<h2 class="h2" style="font-size: 48px">{{t.ctaA}} <span style="color: #F0A3A7">{{t.ctaB}}</span></h2>
<p class="lead" style="font-size: 18px">{{t.ctaSub}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px"><a href="tel:+14047719004" class="btn">{{t.ctaCall}}</a><a href="sms:+14047719004" class="btn2">{{t.ctaText}}</a></div>
</div>
<form style="flex: 1 1 520px; min-width: 0; background: #191D1C; border: 1px solid #343B3A; padding: 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px">
<label class="lab">{{t.fName}}<input type="text" class="in"></label>
<label class="lab">{{t.fPhone}}<input type="tel" class="in"></label>
<label class="lab">{{t.fEmail}}<input type="email" class="in"></label>
<label class="lab">{{t.fType}}<select class="in" data-options="t.types"></select></label>
<label class="lab" style="grid-column: 1 / -1">{{t.fMsg}}<textarea rows="4" class="in"></textarea></label>
<button type="button" class="btn" style="grid-column: 1 / -1; border: 0; cursor: pointer; font-size: 17px">{{t.fSend}}</button>
</form>
</div>
</section>

<footer style="background: #111413; color: #A9B1AF; font-size: 15px">
<div class="wrap" style="padding-top: 48px; padding-bottom: 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 28px">
<div style="display: flex; flex-direction: column; gap: 6px"><span class="wide" style="font-weight: 900; color: #FFFFFF; font-size: 17px">BUILDING IDEAS INC.</span><span>6600 Ganton Dr</span><span>Johns Creek, GA 30097</span><a href="tel:+14047719004" style="color: #FFFFFF">404-771-9004</a><a href="mailto:buildingideasremodeling@gmail.com" style="color: #FFFFFF">buildingideasremodeling@gmail.com</a></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="color: #FFFFFF; font-weight: 700">{{t.hoursLabel}}</span><span>{{t.hours}}</span><a href="#top" style="color: #FFFFFF">{{t.gbp}}</a></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="color: #FFFFFF; font-weight: 700">{{t.linksLabel}}</span><a href="#services" style="color: #A9B1AF">{{t.navServices}}</a><a href="#work" style="color: #A9B1AF">{{t.navWork}}</a><a href="#about" style="color: #A9B1AF">{{t.navAbout}}</a><a href="#area" style="color: #A9B1AF">{{t.navArea}}</a></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="color: #FFFFFF; font-weight: 700">{{t.credLabel}}</span><sc-for list="{{t.creds}}" as="c" hint-placeholder-count="4"><span>{{c}}</span></sc-for></div>
</div>
<div class="wrap" style="padding-top: 16px; padding-bottom: 28px; border-top: 1px solid #2A302F; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; font-size: 13px"><span>© 2026 Building Ideas Inc. · {{t.footLine}}</span><span>{{t.legal}}</span></div>
</footer>

</div>
</script>

        ctaCall: 'Call 404-771-9004', ctaText: 'Text Us', ctaBook: 'Book a Planning Visit',

          { a: '[License #]', b: '[Confirm GA license and insurance]' }

          { title: 'Additions', body: 'Need more space but love your street? We add rooms, suites and second stories that look like they were always there.' },
          { title: 'New Home Construction', body: 'Building new can feel like a gamble. We build custom, infill and investor homes with a clear plan from day one.' },
          { title: 'Design & Preconstruction', body: 'Surprise costs start before the first nail. We handle feasibility, budget, design and permit guidance before you commit.' },
          { title: 'Outdoor Living', body: 'Backyard going unused? We build decks, stone fireplaces and outdoor rooms made for Georgia evenings.' }
        ],
        svcLink: 'More about this',
        workTitle: 'Homes We’ve Transformed', workAll: 'See all projects',
        aboutTitle: 'Building Is What We Do. Planning Is How We Do It.',
        aboutBody: 'Building Ideas is a family company based in Johns Creek. Founder Jair Contreras brings more than 20 years of construction experience and still leads every project relationship.',
