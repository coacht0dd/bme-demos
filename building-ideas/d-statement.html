<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Building Ideas — Statement | Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0E0E}
a{color:#FFFFFF}a:hover{color:#F3B8BB}
.page{font-family:'Manrope',system-ui,sans-serif;color:#FFFFFF;background:#0E0E0E;min-width:0}
.wrap{max-width:1320px;margin:0 auto;padding:0 24px;box-sizing:border-box}
.d{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.5px}
.sec{padding:96px 0}
.paper{background:#F2F0ED;color:#0E0E0E}
.paper a{color:#B0212A}
.white{background:#FFFFFF;color:#0E0E0E}
.white a{color:#B0212A}
.h2{margin:0;font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:72px;line-height:0.95}
.lead{margin:0;font-size:18px;line-height:1.6;color:#CFCFCF}
.paper .lead,.white .lead{color:#3B3B3B}
.btn{display:inline-block;background:#B0212A;color:#FFFFFF;text-decoration:none;font-weight:800;padding:18px 28px;font-size:16px}
.btn:hover{background:#8A1920;color:#FFFFFF}
.btn2{display:inline-block;border:2px solid #FFFFFF;color:#FFFFFF;text-decoration:none;font-weight:800;padding:16px 26px;font-size:16px}
.in{padding:14px;background:#1E1E1E;border:1px solid #4A4A4A;color:#FFFFFF;font-size:16px}
.lab{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
summary{cursor:pointer;font-weight:800;font-size:19px;padding:22px 0}
input,select,textarea{font:inherit}
</style>
<script src="assets/dc-lite.js" defer></script>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="dc-template">
<div class="page">

<div style="background: #B0212A; font-size: 14px">
<div class="wrap" style="padding-top: 9px; padding-bottom: 9px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; justify-content: space-between">
<span>{{t.topbar}} <a href="tel:+14047719004" style="font-weight: 800">{{t.callText}}</a></span>
<div role="group" aria-label="Language" style="display: flex; border: 2px solid #FFFFFF">
<button type="button" onClick="{{setEn}}" aria-pressed="{{isEn}}" style="{{enBtn}}">EN</button>
<button type="button" onClick="{{setEs}}" aria-pressed="{{isEs}}" style="{{esBtn}}">ES</button>
</div>
</div>
</div>

<header style="position: sticky; top: 0; z-index: 20; background: #0E0E0E; border-bottom: 1px solid #2A2A2A">
<div class="wrap" style="padding-top: 14px; padding-bottom: 14px; display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: center; justify-content: space-between">
<a href="#top" aria-label="Building Ideas home" style="display: flex; align-items: center; gap: 12px; text-decoration: none">
<svg width="50" height="40" viewBox="0 0 100 80" aria-hidden="true"><path fill="#FFFFFF" fill-rule="evenodd" d="M0 80V52L34 30V20L64 0L100 22V80ZM10 56h8v18h-8ZM22 50h8v24h-8ZM42 24h10v50h-10ZM60 30h10v44h-10ZM78 34h10v40h-10Z"></path></svg>
<span style="line-height: 0.95; font-weight: 800; font-size: 20px">Building<br>Ideas</span>
</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 6px 24px; font-weight: 700; font-size: 15px">
<a href="#services" style="text-decoration: none">{{t.navServices}}</a>
<a href="#work" style="text-decoration: none">{{t.navWork}}</a>
<a href="#about" style="text-decoration: none">{{t.navAbout}}</a>
<a href="#area" style="text-decoration: none">{{t.navArea}}</a>
<a href="#contact" style="text-decoration: none">{{t.navContact}}</a>
</nav>
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
<a href="tel:+14047719004" style="font-weight: 800; text-decoration: none">404-771-9004</a>
<a href="#contact" class="btn" style="padding: 14px 20px">{{t.ctaBook}}</a>
</div>
</div>
</header>

<section id="top" style="position: relative; overflow: hidden">
<img src="images/stone-feature-wall.jpg" alt="Living room with a dark stacked-stone feature wall" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: block">
<div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(14,14,14,0.66)"></div>
<div class="wrap" style="position: relative; padding-top: 140px; padding-bottom: 88px; display: flex; flex-direction: column; gap: 28px">
<h1 class="d" style="margin: 0; font-size: 132px; line-height: 0.9; max-width: 1180px">{{t.heroA}} <span style="color: #F07A80">{{t.heroB}}</span></h1>
<div style="display: flex; flex-wrap: wrap; gap: 24px 48px; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 12px; max-width: 600px"><p class="lead" style="font-size: 20px; color: #EDEDED">{{t.heroSub}}</p><p style="margin: 0; font-size: 15px; color: #CFCFCF">{{t.heroCred}}</p></div>
<div style="display: flex; flex-wrap: wrap; gap: 12px"><a href="tel:+14047719004" class="btn">{{t.ctaCall}}</a><a href="#contact" class="btn2">{{t.ctaBook}}</a></div>
</div>
</div>
</section>

<section aria-label="Why homeowners choose us" style="border-bottom: 1px solid #2A2A2A">
<div class="wrap" style="padding-top: 36px; padding-bottom: 36px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 28px">
<sc-for list="{{t.trust}}" as="s" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 6px; border-left: 4px solid #B0212A; padding-left: 18px"><span class="d" style="font-size: 40px; line-height: 1">{{s.a}}</span><span style="font-size: 15px; color: #CFCFCF">{{s.b}}</span></div>
</sc-for>
</div>
</section>

<div aria-label="Areas we serve" style="background: #B0212A; overflow: hidden; white-space: nowrap">
<div class="wrap d" style="padding-top: 16px; padding-bottom: 16px; display: flex; gap: 36px; font-size: 32px">
<sc-for list="{{areas}}" as="a" hint-placeholder-count="6"><span>{{a}}</span></sc-for>
</div>
</div>

<section id="services" class="sec paper">
<div class="wrap" style="display: flex; flex-direction: column; gap: 40px">
<h2 class="h2" style="max-width: 980px">{{t.svcTitle}}</h2>
<div style="display: flex; flex-wrap: wrap; gap: 32px">
<ul style="flex: 1 1 520px; min-width: 0; list-style: none; margin: 0; padding: 0; border-top: 3px solid #0E0E0E">
<sc-for list="{{svcRows}}" as="s" hint-placeholder-count="6">
<li style="border-bottom: 1px solid #C9C4BD">
<button type="button" onClick="{{s.pick}}" aria-pressed="{{s.active}}" style="{{s.style}}">
<span class="d" style="font-size: 24px; min-width: 48px">{{s.n}}</span>
<span style="display: flex; flex-direction: column; gap: 6px; text-align: left"><span class="d" style="font-size: 30px; line-height: 1">{{s.title}}</span><span style="font-size: 15px; line-height: 1.5; font-weight: 500">{{s.body}}</span></span>
</button>
</li>
</sc-for>
</ul>
<div style="flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<img src="{{svc.img}}" alt="{{svc.title}}" style="width: 100%; height: 600px; object-fit: cover; display: block">
<a href="#services" style="font-weight: 800">{{t.svcLink}}: {{svc.title}} →</a>
</div>
</div>
</div>
</section>

<section id="work" class="sec">
<div class="wrap" style="display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between"><h2 class="h2">{{t.workTitle}}</h2><a href="#work" style="font-weight: 800; border-bottom: 2px solid #B0212A; padding-bottom: 4px; text-decoration: none">{{t.workAll}} →</a></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px">
<sc-for list="{{work}}" as="w" hint-placeholder-count="6">
<a href="#work" style="position: relative; display: block; height: 400px; overflow: hidden; text-decoration: none">
<img src="{{w.img}}" alt="{{w.name}}" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: block">
<span style="position: absolute; left: 0; bottom: 0; right: 0; background: rgba(14,14,14,0.8); padding: 16px 18px; display: flex; justify-content: space-between; gap: 12px"><span class="d" style="font-size: 24px">{{w.name}}</span><span style="font-size: 14px; font-weight: 600; color: #E3E3E3; align-self: center">{{w.tag}}</span></span>
</a>
</sc-for>
</div>
</div>
</section>

<section id="about" class="sec white">
<div class="wrap" style="display: flex; flex-wrap: wrap; gap: 48px; align-items: center">
<img src="images/crew-stone-fireplace.jpg" alt="Building Ideas crew installing a two-story stone fireplace" style="flex: 1 1 380px; min-width: 0; width: 100%; height: 600px; object-fit: cover; display: block">
<div style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<h2 class="h2" style="font-size: 60px">{{t.aboutTitle}}</h2>
<p class="lead">{{t.aboutBody}}</p>
<p style="margin: 0; font-size: 16px; color: #B0212A; font-weight: 600">{{t.aboutStory}}</p>
<ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0 24px">
<sc-for list="{{t.team}}" as="m" hint-placeholder-count="4"><li style="border-top: 2px solid #0E0E0E; padding: 12px 0; display: flex; flex-direction: column; gap: 4px"><span style="font-weight: 800; font-size: 17px">{{m.name}}</span><span style="font-size: 14px; color: #4A4A4A">{{m.role}}</span></li></sc-for>
</ul>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{t.creds}}" as="c" hint-placeholder-count="4"><span style="background: #0E0E0E; color: #FFFFFF; padding: 7px 12px; font-size: 14px; font-weight: 600">{{c}}</span></sc-for></div>
</div>
</div>
</section>

<section id="area" class="sec">
<div class="wrap" style="display: flex; flex-wrap: wrap; gap: 40px; align-items: center">
<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
<h2 class="h2" style="font-size: 64px">{{t.areaTitle}}</h2>
<p class="lead">{{t.areaBody}}</p>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{areas}}" as="a" hint-placeholder-count="6"><li><a href="#area" style="display: block; border: 2px solid #FFFFFF; padding: 10px 16px; text-decoration: none; font-weight: 800">{{a}}</a></li></sc-for></ul>
<p style="margin: 0; font-size: 15px; color: #A8A8A8">{{t.areaRadius}}</p>
</div>
<div style="flex: 1 1 460px; min-width: 0; height: 400px; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; background-color: #1A1A1A; background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.06) 0 1px, transparent 1px 40px), repeating-linear-gradient(90deg, rgba(255,255,255,0.06) 0 1px, transparent 1px 40px); text-align: center; color: #CFCFCF; font-weight: 700">{{t.mapLabel}}</div>
</div>
</section>

<section aria-label="Reviews" class="sec paper">
<div class="wrap" style="display: flex; flex-direction: column; gap: 36px">
<h2 class="h2">{{t.revTitle}}</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px">
<sc-for list="{{t.reviews}}" as="r" hint-placeholder-count="3">
<figure style="margin: 0; background: #0E0E0E; color: #FFFFFF; padding: 32px; display: flex; flex-direction: column; justify-content: space-between; gap: 18px"><blockquote style="margin: 0; font-size: 19px; line-height: 1.5; font-weight: 600">{{r.q}}</blockquote><figcaption class="d" style="font-size: 22px; color: #F07A80">{{r.who}}</figcaption></figure>
</sc-for>
</div>
<a href="#top" style="font-weight: 800">{{t.revNote}} →</a>
</div>
</section>

<section id="plans" class="sec">
<div class="wrap" style="display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; flex-wrap: wrap; gap: 16px 48px; align-items: flex-end; justify-content: space-between"><h2 class="h2">{{t.plansTitle}}</h2><p class="lead" style="max-width: 440px">{{t.plansSub}}</p></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px">
<sc-for list="{{plans}}" as="p" hint-placeholder-count="3">
<article style="{{p.box}}">
<sc-if value="{{p.featured}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px">{{t.featLabel}}</span></sc-if>
<h3 class="d" style="margin: 0; font-size: 36px">{{p.name}}</h3>
<div class="d" style="font-size: 48px">{{p.price}}</div>
<p style="margin: 0; font-size: 16px; line-height: 1.55">{{p.body}}</p>
<ul style="margin: 0; padding-left: 20px; font-size: 15px; line-height: 1.8"><sc-for list="{{p.points}}" as="pt" hint-placeholder-count="3"><li>{{pt}}</li></sc-for></ul>
<a href="#contact" style="{{p.btn}}">{{p.cta}}</a>
</article>
</sc-for>
</div>
<p style="margin: 0; font-size: 14px; color: #A8A8A8">{{t.plansNote}}</p>
</div>
</section>

<section aria-label="Free guide" style="background: #1A1A1A; border-top: 1px solid #2A2A2A; border-bottom: 1px solid #2A2A2A">
<div class="wrap" style="padding-top: 56px; padding-bottom: 56px; display: flex; flex-wrap: wrap; gap: 24px 40px; align-items: center; justify-content: space-between">
<div style="display: flex; gap: 24px; align-items: center; flex: 1 1 520px; min-width: 0">
<div class="d" style="width: 100px; height: 128px; flex-shrink: 0; background: #B0212A; display: flex; align-items: flex-end; padding: 10px; box-sizing: border-box; font-size: 15px; line-height: 1.05">{{t.magTitle}}</div>
<div style="display: flex; flex-direction: column; gap: 8px"><h2 class="d" style="margin: 0; font-size: 36px; font-weight: 400">{{t.magTitle}}</h2><p class="lead" style="font-size: 16px">{{t.magBody}}</p><span style="font-size: 13px; color: #F07A80">{{t.magNote}}</span></div>
</div>
<a href="#top" class="btn">{{t.magCta}}</a>
</div>
</section>

<section aria-label="Questions" class="sec white">
<div class="wrap" style="display: flex; flex-wrap: wrap; gap: 40px">
<h2 class="h2" style="flex: 1 1 360px; min-width: 0; font-size: 60px">{{t.faqTitle}}</h2>
<div style="flex: 2 1 560px; min-width: 0; border-top: 3px solid #0E0E0E">
<sc-for list="{{t.faq}}" as="f" hint-placeholder-count="5"><details style="border-bottom: 1px solid #D4D0CA"><summary>{{f.q}}</summary><p class="lead" style="padding-bottom: 22px">{{f.a}}</p></details></sc-for>
</div>
</div>
</section>

<section aria-label="Tips" class="sec">
<div class="wrap" style="display: flex; flex-direction: column; gap: 32px">
<h2 class="h2" style="font-size: 60px">{{t.blogTitle}}</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px">
<sc-for list="{{blog}}" as="b" hint-placeholder-count="3">
<a href="#top" style="text-decoration: none; background: #1A1A1A; display: flex; flex-direction: column">
<img src="{{b.img}}" alt="{{b.title}}" style="width: 100%; height: 200px; object-fit: cover; display: block">
<span style="padding: 22px; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 12px; font-weight: 800; color: #F07A80; text-transform: uppercase; letter-spacing: 2px">{{b.tag}}</span><span class="d" style="font-size: 26px; line-height: 1.05">{{b.title}}</span></span>
</a>
</sc-for>
</div>
<p style="margin: 0; font-size: 14px; color: #A8A8A8">{{t.blogNote}}</p>
</div>
</section>

<section id="contact" class="sec" style="background: #B0212A">
<div class="wrap" style="display: flex; flex-wrap: wrap; gap: 48px">
<div style="flex: 1 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<h2 class="h2" style="font-size: 92px; line-height: 0.92">{{t.ctaA}} <span style="color: #0E0E0E">{{t.ctaB}}</span></h2>
<p class="lead" style="color: #FCE4E5">{{t.ctaSub}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px"><a href="tel:+14047719004" class="btn" style="background: #FFFFFF; color: #B0212A">{{t.ctaCall}}</a><a href="sms:+14047719004" class="btn2">{{t.ctaText}}</a></div>
</div>
<form style="flex: 1 1 460px; min-width: 0; background: #0E0E0E; padding: 36px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px">
<label class="lab">{{t.fName}}<input type="text" class="in"></label>
<label class="lab">{{t.fPhone}}<input type="tel" class="in"></label>
<label class="lab">{{t.fEmail}}<input type="email" class="in"></label>
<label class="lab">{{t.fType}}<select class="in" data-options="t.types"></select></label>
<label class="lab" style="grid-column: 1 / -1">{{t.fMsg}}<textarea rows="4" class="in"></textarea></label>
<button type="button" class="d" style="grid-column: 1 / -1; background: #FFFFFF; color: #0E0E0E; border: 0; padding: 18px; font-size: 24px; cursor: pointer">{{t.fSend}}</button>
</form>
</div>
</section>

<footer style="font-size: 15px; color: #BDBDBD">
<div class="wrap" style="padding-top: 48px; padding-bottom: 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 28px">
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-weight: 800; color: #FFFFFF; font-size: 17px">BUILDING IDEAS INC.</span><span>6600 Ganton Dr</span><span>Johns Creek, GA 30097</span><a href="tel:+14047719004">404-771-9004</a><a href="mailto:buildingideasremodeling@gmail.com">buildingideasremodeling@gmail.com</a></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="color: #FFFFFF; font-weight: 800">{{t.hoursLabel}}</span><span>{{t.hours}}</span><a href="#top">{{t.gbp}}</a></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="color: #FFFFFF; font-weight: 800">{{t.linksLabel}}</span><a href="#services" style="color: #BDBDBD">{{t.navServices}}</a><a href="#work" style="color: #BDBDBD">{{t.navWork}}</a><a href="#about" style="color: #BDBDBD">{{t.navAbout}}</a><a href="#area" style="color: #BDBDBD">{{t.navArea}}</a></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="color: #FFFFFF; font-weight: 800">{{t.credLabel}}</span><sc-for list="{{t.creds}}" as="c" hint-placeholder-count="4"><span>{{c}}</span></sc-for></div>
</div>
<div class="wrap" style="padding-top: 16px; padding-bottom: 28px; border-top: 1px solid #2A2A2A; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; font-size: 13px"><span>© 2026 Building Ideas Inc. · {{t.footLine}}</span><span>{{t.legal}}</span></div>
</footer>

</div>
</script>
