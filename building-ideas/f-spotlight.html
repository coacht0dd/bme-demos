<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Building Ideas — Spotlight | Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#9B1C23}a:hover{color:#5E1014}
.page{font-family:'Figtree',system-ui,sans-serif;color:#141414;background:#FFFFFF;min-width:0}
.wrap{max-width:1320px;margin:0 auto;padding:0 24px;box-sizing:border-box}
.u{font-family:'Unbounded',system-ui,sans-serif;font-weight:800;letter-spacing:-1px}
.sec{padding:92px 0}
.sand{background:#F4F1EC}
.red{background:#9B1C23;color:#FFFFFF}
.red a{color:#FFFFFF}
.red a.btnW{color:#9B1C23}
.blk{background:#141414;color:#FFFFFF}
.blk a{color:#F28C92}
.h2{margin:0;font-family:'Unbounded',system-ui,sans-serif;font-weight:800;letter-spacing:-1px;font-size:46px;line-height:1.02}
.lead{margin:0;font-size:17px;line-height:1.6;color:#3D3D3D}
.red .lead{color:#FBE3E4}
.blk .lead{color:#D4D4D4}
.btn{display:inline-block;background:#9B1C23;color:#FFFFFF;text-decoration:none;font-weight:700;padding:17px 26px;border-radius:10px;font-size:16px}
.btn:hover{background:#7A161C;color:#FFFFFF}
.btnW{display:inline-block;background:#FFFFFF;color:#9B1C23;text-decoration:none;font-weight:700;padding:17px 26px;border-radius:10px;font-size:16px}
.btnO{display:inline-block;border:2px solid #FFFFFF;color:#FFFFFF;text-decoration:none;font-weight:700;padding:15px 24px;border-radius:10px;font-size:16px}
.in{padding:14px;border:1.5px solid #CFCFCF;border-radius:10px;font-size:16px;background:#FFFFFF}
.lab{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
summary{cursor:pointer;font-weight:700;font-size:18px;padding:20px 0}
input,select,textarea{font:inherit}
</style>
<script src="assets/dc-lite.js" defer></script>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="dc-template">
<div class="page">

<div class="blk" style="font-size: 14px">
<div class="wrap" style="padding-top: 9px; padding-bottom: 9px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; justify-content: space-between">
<span>{{t.topbar}} <a href="tel:+14047719004" style="color: #FFFFFF; font-weight: 700">{{t.callText}}</a></span>
<div role="group" aria-label="Language" style="display: flex; border: 1px solid rgba(255,255,255,0.5); border-radius: 8px; overflow: hidden">
<button type="button" onClick="{{setEn}}" aria-pressed="{{isEn}}" style="{{enBtn}}">EN</button>
<button type="button" onClick="{{setEs}}" aria-pressed="{{isEs}}" style="{{esBtn}}">ES</button>
</div>
</div>
</div>

<header class="red" style="position: sticky; top: 0; z-index: 20">
<div class="wrap" style="padding-top: 14px; padding-bottom: 14px; display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: center; justify-content: space-between">
<a href="#top" aria-label="Building Ideas home" style="display: flex; align-items: center; gap: 12px; text-decoration: none">
<svg width="32" height="40" viewBox="0 0 100 120" aria-hidden="true"><rect x="40" y="0" width="14" height="14" fill="#FFFFFF"></rect><rect x="40" y="22" width="14" height="62" fill="#FFFFFF"></rect><rect x="12" y="52" width="14" height="28" fill="#FFFFFF"></rect><circle cx="52" cy="80" r="33" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-dasharray="155.5 51.8" transform="rotate(-90 52 80)"></circle></svg>
<span class="u" style="font-size: 17px; letter-spacing: 0">BUILDING IDEAS</span>
</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 6px 24px; font-weight: 600; font-size: 15px">
<a href="#services" style="text-decoration: none">{{t.navServices}}</a>
<a href="#work" style="text-decoration: none">{{t.navWork}}</a>
<a href="#about" style="text-decoration: none">{{t.navAbout}}</a>
<a href="#area" style="text-decoration: none">{{t.navArea}}</a>
<a href="#contact" style="text-decoration: none">{{t.navContact}}</a>
</nav>
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
<a href="tel:+14047719004" style="font-weight: 700; text-decoration: none">404-771-9004</a>
<a href="#contact" class="btnW" style="padding: 13px 18px">{{t.ctaBook}}</a>
</div>
</div>
</header>

<section id="top" style="position: relative; overflow: hidden">
<img src="images/outdoor-fireplace.jpg" alt="Stone outdoor fireplace on a new deck" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: block">
<div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(40,8,11,0.7)"></div>
<div class="wrap" style="position: relative; padding-top: 128px; padding-bottom: 128px; color: #FFFFFF; display: flex; flex-direction: column; gap: 26px">
<h1 class="u" style="margin: 0; font-size: 70px; line-height: 1; max-width: 1000px">{{t.heroA}} <span style="color: #F28C92">{{t.heroB}}</span></h1>
<p style="margin: 0; font-size: 20px; line-height: 1.55; color: #F3E6E7; max-width: 620px">{{t.heroSub}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px"><a href="tel:+14047719004" class="btnW">{{t.ctaCall}}</a><a href="#contact" class="btnO">{{t.ctaBook}}</a></div>
<p style="margin: 0; font-size: 15px; color: #E9CFD1">{{t.heroCred}}</p>
</div>
</section>

<section aria-label="Why homeowners choose us" class="blk">
<div class="wrap" style="padding-top: 32px; padding-bottom: 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px">
<sc-for list="{{t.trust}}" as="s" hint-placeholder-count="4"><div style="display: flex; flex-direction: column; gap: 6px"><span class="u" style="font-size: 26px; color: #F28C92">{{s.a}}</span><span style="font-size: 15px; color: #D4D4D4">{{s.b}}</span></div></sc-for>
</div>
</section>

<div aria-label="Areas we serve" class="red" style="overflow: hidden; white-space: nowrap">
<div class="wrap u" style="padding-top: 14px; padding-bottom: 14px; display: flex; gap: 32px; font-size: 16px; letter-spacing: 0">
<sc-for list="{{areas}}" as="a" hint-placeholder-count="6"><span>{{a}}</span></sc-for>
</div>
</div>

<section id="services" class="sec">
<div class="wrap" style="display: flex; flex-direction: column; gap: 36px">
<h2 class="h2" style="max-width: 860px">{{t.svcTitle}}</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px">
<sc-for list="{{services}}" as="s" hint-placeholder-count="6">
<article style="position: relative; height: 440px; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end">
<img src="{{s.img}}" alt="{{s.title}}" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: block">
<div style="position: relative; background: #141414; color: #FFFFFF; margin: 12px; border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 8px">
<h3 class="u" style="margin: 0; font-size: 20px">{{s.title}}</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #D4D4D4">{{s.body}}</p>
<a href="#services" style="color: #F28C92; font-weight: 700; font-size: 14px">{{t.svcLink}} →</a>
</div>
</article>
</sc-for>
</div>
</div>
</section>

<section id="work" class="sec sand">
<div class="wrap" style="display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between">
<h2 class="h2">{{t.workTitle}}</h2>
<div style="display: flex; gap: 10px; align-items: center">
<span class="u" style="font-size: 17px; min-width: 72px">{{counter}}</span>
<button type="button" onClick="{{prev}}" aria-label="{{t.prev}}" style="width: 56px; height: 56px; border-radius: 50%; border: 2px solid #141414; background: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
<button type="button" onClick="{{next}}" aria-label="{{t.next}}" style="width: 56px; height: 56px; border-radius: 50%; border: 2px solid #9B1C23; background: #9B1C23; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; background: #FFFFFF; border-radius: 20px; overflow: hidden">
<img src="{{cur.img}}" alt="{{cur.name}}" style="flex: 3 1 560px; min-width: 0; width: 100%; height: 560px; object-fit: cover; display: block">
<div style="flex: 2 1 360px; min-width: 0; padding: 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
<span style="align-self: flex-start; background: #9B1C23; color: #FFFFFF; padding: 7px 12px; border-radius: 6px; font-size: 13px; font-weight: 700">{{cur.tag}}</span>
<h3 class="u" style="margin: 0; font-size: 34px; line-height: 1.05">{{cur.name}}</h3>
<p class="lead" style="font-size: 18px">{{cur.body}}</p>
<div style="margin-top: auto; display: flex; flex-wrap: wrap; gap: 4px"><sc-for list="{{dots}}" as="d" hint-placeholder-count="6"><button type="button" onClick="{{d.pick}}" aria-label="{{d.label}}" aria-pressed="{{d.active}}" style="min-width: 44px; height: 44px; border: 0; background: transparent; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center"><span style="{{d.style}}"></span></button></sc-for></div>
<a href="#work" style="font-weight: 700">{{t.workAll}} →</a>
</div>
</div>
</div>
</section>

<section id="about" class="sec red">
<div class="wrap" style="display: flex; flex-wrap: wrap; gap: 48px; align-items: center">
<div style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
<h2 class="h2">{{t.aboutTitle}}</h2>
<p class="lead" style="font-size: 18px">{{t.aboutBody}}</p>
<p style="margin: 0; font-size: 16px; color: #FFD7DA; font-weight: 600">{{t.aboutStory}}</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px"><sc-for list="{{t.team}}" as="m" hint-placeholder-count="4"><div style="background: rgba(0,0,0,0.22); border-radius: 14px; padding: 16px"><div style="font-weight: 700; font-size: 17px">{{m.name}}</div><div style="font-size: 14px; color: #FBE3E4">{{m.role}}</div></div></sc-for></div>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{t.creds}}" as="c" hint-placeholder-count="4"><span style="border: 1px solid rgba(255,255,255,0.5); padding: 6px 12px; border-radius: 8px; font-size: 14px">{{c}}</span></sc-for></div>
</div>
<img src="images/crew-stone-fireplace.jpg" alt="Building Ideas crew installing a two-story stone fireplace" style="flex: 1 1 360px; min-width: 0; width: 100%; height: 580px; object-fit: cover; border-radius: 20px; display: block">
</div>
</section>

<section id="area" class="sec">
<div class="wrap" style="display: flex; flex-wrap: wrap; gap: 40px; align-items: center">
<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<h2 class="h2">{{t.areaTitle}}</h2>
<p class="lead">{{t.areaBody}}</p>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{areas}}" as="a" hint-placeholder-count="6"><li><a href="#area" style="display: block; background: #F4F1EC; padding: 10px 16px; border-radius: 8px; color: #141414; text-decoration: none; font-weight: 700">{{a}}</a></li></sc-for></ul>
<p style="margin: 0; font-size: 15px; color: #555555">{{t.areaRadius}}</p>
</div>
<div style="flex: 1 1 460px; min-width: 0; height: 380px; border-radius: 20px; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; background-color: #F4F1EC; background-image: repeating-linear-gradient(0deg, rgba(20,20,20,0.07) 0 1px, transparent 1px 40px), repeating-linear-gradient(90deg, rgba(20,20,20,0.07) 0 1px, transparent 1px 40px); text-align: center; color: #3D3D3D; font-weight: 700">{{t.mapLabel}}</div>
</div>
</section>

<section aria-label="Reviews" class="sec sand">
<div class="wrap" style="display: flex; flex-direction: column; gap: 32px">
<h2 class="h2">{{t.revTitle}}</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px">
<sc-for list="{{t.reviews}}" as="r" hint-placeholder-count="3"><figure style="margin: 0; background: #FFFFFF; border-radius: 20px; padding: 32px; display: flex; flex-direction: column; justify-content: space-between; gap: 18px"><blockquote style="margin: 0; font-size: 19px; line-height: 1.5; font-weight: 500">{{r.q}}</blockquote><figcaption class="u" style="font-size: 15px; color: #9B1C23; letter-spacing: 0">{{r.who}}</figcaption></figure></sc-for>
</div>
<a href="#top" style="font-weight: 700">{{t.revNote}} →</a>
</div>
</section>

<section id="plans" class="sec">
<div class="wrap" style="display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-wrap: wrap; gap: 12px 40px; align-items: flex-end; justify-content: space-between"><h2 class="h2">{{t.plansTitle}}</h2><p class="lead" style="max-width: 440px">{{t.plansSub}}</p></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px">
<sc-for list="{{plans}}" as="p" hint-placeholder-count="3">
<article style="{{p.box}}">
<sc-if value="{{p.featured}}" hint-placeholder-val="{{false}}"><span style="align-self: flex-start; background: #FFFFFF; color: #9B1C23; font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 6px">{{t.featLabel}}</span></sc-if>
<h3 class="u" style="margin: 0; font-size: 22px">{{p.name}}</h3>
<div class="u" style="font-size: 36px">{{p.price}}</div>
<p style="margin: 0; font-size: 16px; line-height: 1.55">{{p.body}}</p>
<ul style="margin: 0; padding-left: 20px; font-size: 15px; line-height: 1.8"><sc-for list="{{p.points}}" as="pt" hint-placeholder-count="3"><li>{{pt}}</li></sc-for></ul>
<a href="#contact" style="{{p.btn}}">{{p.cta}}</a>
</article>
</sc-for>
</div>
<p style="margin: 0; font-size: 14px; color: #555555">{{t.plansNote}}</p>
</div>
</section>

<section aria-label="Free guide" class="blk">
<div class="wrap" style="padding-top: 56px; padding-bottom: 56px; display: flex; flex-wrap: wrap; gap: 24px 40px; align-items: center; justify-content: space-between">
<div style="display: flex; gap: 24px; align-items: center; flex: 1 1 520px; min-width: 0">
<div class="u" style="width: 100px; height: 128px; flex-shrink: 0; background: #9B1C23; border-radius: 10px; display: flex; align-items: flex-end; padding: 10px; box-sizing: border-box; font-size: 11px; line-height: 1.2; letter-spacing: 0">{{t.magTitle}}</div>
<div style="display: flex; flex-direction: column; gap: 8px"><h2 class="u" style="margin: 0; font-size: 26px">{{t.magTitle}}</h2><p class="lead" style="font-size: 16px">{{t.magBody}}</p><span style="font-size: 13px; color: #F28C92">{{t.magNote}}</span></div>
</div>
<a href="#top" class="btn">{{t.magCta}}</a>
</div>
</section>

<section aria-label="Questions" class="sec">
<div class="wrap" style="display: flex; flex-wrap: wrap; gap: 40px">
<h2 class="h2" style="flex: 1 1 320px; min-width: 0">{{t.faqTitle}}</h2>
<div style="flex: 2 1 560px; min-width: 0; border-top: 2px solid #141414">
<sc-for list="{{t.faq}}" as="f" hint-placeholder-count="5"><details style="border-bottom: 1px solid #DDD7CF"><summary>{{f.q}}</summary><p class="lead" style="padding-bottom: 20px">{{f.a}}</p></details></sc-for>
</div>
</div>
</section>

<section aria-label="Tips" class="sec sand">
<div class="wrap" style="display: flex; flex-direction: column; gap: 28px">
<h2 class="h2">{{t.blogTitle}}</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px">
<sc-for list="{{blog}}" as="b" hint-placeholder-count="3">
<a href="#top" style="background: #FFFFFF; border-radius: 20px; overflow: hidden; text-decoration: none; color: #141414; display: flex; flex-direction: column">
<img src="{{b.img}}" alt="{{b.title}}" style="width: 100%; height: 190px; object-fit: cover; display: block">
<span style="padding: 20px; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; font-weight: 700; color: #9B1C23">{{b.tag}}</span><span class="u" style="font-size: 18px; line-height: 1.2; letter-spacing: -0.3px">{{b.title}}</span></span>
</a>
</sc-for>
</div>
<p style="margin: 0; font-size: 14px; color: #555555">{{t.blogNote}}</p>
</div>
</section>

<section id="contact" class="sec blk">
<div class="wrap" style="display: flex; flex-wrap: wrap; gap: 48px">
<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
<h2 class="h2" style="font-size: 54px">{{t.ctaA}} <span style="color: #F28C92">{{t.ctaB}}</span></h2>
<p class="lead" style="font-size: 18px">{{t.ctaSub}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px"><a href="tel:+14047719004" class="btn">{{t.ctaCall}}</a><a href="sms:+14047719004" class="btnO">{{t.ctaText}}</a></div>
</div>
<form style="flex: 1 1 480px; min-width: 0; background: #FFFFFF; color: #141414; border-radius: 20px; padding: 36px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px">
<label class="lab">{{t.fName}}<input type="text" class="in"></label>
<label class="lab">{{t.fPhone}}<input type="tel" class="in"></label>
<label class="lab">{{t.fEmail}}<input type="email" class="in"></label>
<label class="lab">{{t.fType}}<select class="in" data-options="t.types"></select></label>
<label class="lab" style="grid-column: 1 / -1">{{t.fMsg}}<textarea rows="4" class="in"></textarea></label>
<button type="button" class="btn" style="grid-column: 1 / -1; border: 0; cursor: pointer; font-size: 17px">{{t.fSend}}</button>
</form>
</div>
</section>

<footer style="background: #0A0A0A; color: #BDBDBD; font-size: 15px">
<div class="wrap" style="padding-top: 48px; padding-bottom: 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 28px">
<div style="display: flex; flex-direction: column; gap: 6px"><span class="u" style="color: #FFFFFF; font-size: 15px; letter-spacing: 0">BUILDING IDEAS INC.</span><span>6600 Ganton Dr</span><span>Johns Creek, GA 30097</span><a href="tel:+14047719004" style="color: #FFFFFF">404-771-9004</a><a href="mailto:buildingideasremodeling@gmail.com" style="color: #FFFFFF">buildingideasremodeling@gmail.com</a></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="color: #FFFFFF; font-weight: 700">{{t.hoursLabel}}</span><span>{{t.hours}}</span><a href="#top" style="color: #FFFFFF">{{t.gbp}}</a></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="color: #FFFFFF; font-weight: 700">{{t.linksLabel}}</span><a href="#services" style="color: #BDBDBD">{{t.navServices}}</a><a href="#work" style="color: #BDBDBD">{{t.navWork}}</a><a href="#about" style="color: #BDBDBD">{{t.navAbout}}</a><a href="#area" style="color: #BDBDBD">{{t.navArea}}</a></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="color: #FFFFFF; font-weight: 700">{{t.credLabel}}</span><sc-for list="{{t.creds}}" as="c" hint-placeholder-count="4"><span>{{c}}</span></sc-for></div>
</div>
<div class="wrap" style="padding-top: 16px; padding-bottom: 28px; border-top: 1px solid #262626; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; font-size: 13px"><span>© 2026 Building Ideas Inc. · {{t.footLine}}</span><span>{{t.legal}}</span></div>
</footer>

</div>
</script>
<script type="text/x-dc-logic" id="dc-logic">
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { lang: 'en', i: 0 }; }
  renderVals() {
    const L = {
      en: {
        topbar: 'Planning a remodel, addition or new home in North Metro Atlanta?', callText: 'Call or text 404-771-9004',
        navServices: 'Services', navWork: 'Our Work', navAbout: 'About', navArea: 'Service Area', navContact: 'Contact',
        ctaCall: 'Call 404-771-9004', ctaText: 'Text Us', ctaBook: 'Book a Planning Visit',
        heroA: 'Love the Home You Have.', heroB: 'We Handle the Build.',
        heroSub: 'Remodels, additions and new homes across Johns Creek and North Metro Atlanta, planned on paper first so there are no surprises on site.',
        heroCred: 'Family-owned · 15 years in business · 20+ years in construction',
        trust: [
          { a: 'Family-owned', b: 'Led by founder Jair Contreras' },
          { a: '15 years', b: 'Building in North Metro Atlanta' },
          { a: 'Plan first', b: 'Written scope and budget before work starts' },
          { a: '[License #]', b: '[Confirm GA license and insurance]' }
        ],
        svcTitle: 'Whatever Your Home Needs Next, We Build It',
        services: [
          { title: 'Whole-Home Remodeling', body: 'Outgrown your layout or stuck with a dated house? We plan it and rebuild it room by room, so it finally fits how you live.' },
          { title: 'Kitchens & Baths', body: 'A kitchen that doesn’t work makes every day harder. We design, build and finish kitchens and baths with clean, organized job sites.' },
          { title: 'Additions', body: 'Need more space but love your street? We add rooms, suites and second stories that look like they were always there.' },
          { title: 'New Home Construction', body: 'Building new can feel like a gamble. We build custom, infill and investor homes with a clear plan from day one.' },
          { title: 'Design & Preconstruction', body: 'Surprise costs start before the first nail. We handle feasibility, budget, design and permit guidance before you commit.' },
