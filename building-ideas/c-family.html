<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Building Ideas — Family Builder | Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#8B1A1F}a:hover{color:#5E1013}
.page{font-family:'Montserrat',system-ui,sans-serif;color:#161616;background:#FFFFFF;min-width:0}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px;box-sizing:border-box}
.sec{padding:88px 0}
.warm{background:#F3F1EE}
.ink{background:#161616;color:#FFFFFF}
.ink a{color:#F5B3B7}
.h2{margin:0;font-size:38px;line-height:1.14;font-weight:800;letter-spacing:-0.5px}
.lead{margin:0;font-size:17px;line-height:1.65;color:#444444}
.ink .lead{color:#D9D9D9}
.btn{display:inline-block;background:#8B1A1F;color:#FFFFFF;text-decoration:none;font-weight:700;padding:16px 26px;border-radius:999px;font-size:16px}
.btn:hover{background:#6E1418;color:#FFFFFF}
.btn2{display:inline-block;border:2px solid #FFFFFF;color:#FFFFFF;text-decoration:none;font-weight:700;padding:14px 24px;border-radius:999px;font-size:16px}
.card{background:#FFFFFF;border:1px solid #E4DFD8;border-radius:16px}
.in{padding:13px 16px;border:0;border-radius:10px;font-size:16px;background:#FFFFFF}
.lab{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
summary{cursor:pointer;font-weight:700;font-size:18px;padding:20px 0}
input,select,textarea{font:inherit}
</style>
<script src="assets/dc-lite.js" defer></script>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="dc-template">
<div class="page">

<div style="background: #8B1A1F; color: #FFFFFF; font-size: 14px">
<div class="wrap" style="padding-top: 9px; padding-bottom: 9px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; justify-content: space-between">
<span>{{t.topbar}} <a href="tel:+14047719004" style="color: #FFFFFF; font-weight: 700">{{t.callText}}</a></span>
<div role="group" aria-label="Language" style="display: flex; background: rgba(255,255,255,0.15); border-radius: 999px; padding: 3px">
<button type="button" onClick="{{setEn}}" aria-pressed="{{isEn}}" style="{{enBtn}}">EN</button>
<button type="button" onClick="{{setEs}}" aria-pressed="{{isEs}}" style="{{esBtn}}">ES</button>
</div>
</div>
</div>

<header style="position: sticky; top: 0; z-index: 20; background: #FFFFFF; border-bottom: 1px solid #E4DFD8">
<div class="wrap" style="padding-top: 14px; padding-bottom: 14px; display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: center; justify-content: space-between">
<a href="#top" aria-label="Building Ideas home" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #161616">
<svg width="34" height="42" viewBox="0 0 100 120" aria-hidden="true"><rect x="40" y="0" width="14" height="14" fill="#8B1A1F"></rect><rect x="40" y="22" width="14" height="62" fill="#8B1A1F"></rect><rect x="12" y="52" width="14" height="28" fill="#8B1A1F"></rect><circle cx="52" cy="80" r="33" fill="none" stroke="#8B1A1F" stroke-width="14" stroke-dasharray="155.5 51.8" transform="rotate(-90 52 80)"></circle></svg>
<span style="font-weight: 800; font-size: 20px; letter-spacing: 0.5px">BUILDING IDEAS</span>
</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 6px 22px; font-weight: 600; font-size: 15px">
<a href="#services" style="color: #161616; text-decoration: none">{{t.navServices}}</a>
<a href="#work" style="color: #161616; text-decoration: none">{{t.navWork}}</a>
<a href="#about" style="color: #161616; text-decoration: none">{{t.navAbout}}</a>
<a href="#area" style="color: #161616; text-decoration: none">{{t.navArea}}</a>
<a href="#contact" style="color: #161616; text-decoration: none">{{t.navContact}}</a>
</nav>
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
<a href="tel:+14047719004" style="font-weight: 700; color: #161616; text-decoration: none">404-771-9004</a>
<a href="#contact" class="btn">{{t.ctaBook}}</a>
</div>
</div>
</header>

<section id="top" style="position: relative; overflow: hidden">
<img src="images/two-story-home.jpg" alt="Two-story white home with dark shutters" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: block">
<div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(70,12,16,0.74)"></div>
<div class="wrap" style="position: relative; padding-top: 120px; padding-bottom: 120px; color: #FFFFFF; display: flex; flex-wrap: wrap; gap: 40px; align-items: center">
<div style="flex: 1 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
<h1 style="margin: 0; font-size: 58px; line-height: 1.06; font-weight: 800; letter-spacing: -1px">{{t.heroA}} <span style="color: #F5B3B7">{{t.heroB}}</span></h1>
<p style="margin: 0; font-size: 19px; line-height: 1.6; color: #FBE6E7; max-width: 580px">{{t.heroSub}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<a href="tel:+14047719004" class="btn" style="background: #FFFFFF; color: #8B1A1F">{{t.ctaCall}}</a>
<a href="#contact" class="btn2">{{t.ctaBook}}</a>
</div>
<p style="margin: 0; font-size: 15px; color: #F6D5D7">{{t.heroCred}}</p>
</div>
<svg viewBox="0 0 100 120" style="flex: 0 1 220px; width: 220px; height: auto" aria-hidden="true"><rect x="40" y="0" width="14" height="14" fill="rgba(255,255,255,0.9)"></rect><rect x="40" y="22" width="14" height="62" fill="rgba(255,255,255,0.9)"></rect><rect x="12" y="52" width="14" height="28" fill="rgba(255,255,255,0.9)"></rect><circle cx="52" cy="80" r="33" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="14" stroke-dasharray="155.5 51.8" transform="rotate(-90 52 80)"></circle></svg>
</div>
</section>

<section aria-label="Why homeowners choose us" class="ink">
<div class="wrap" style="padding-top: 28px; padding-bottom: 28px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px">
<sc-for list="{{t.trust}}" as="item" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 20px; font-weight: 800; color: #F08A90">{{item.a}}</span><span style="font-size: 15px; color: #D9D9D9">{{item.b}}</span></div>
</sc-for>
</div>
</section>

<div aria-label="Areas we serve" class="warm" style="overflow: hidden; white-space: nowrap">
<div class="wrap" style="padding-top: 14px; padding-bottom: 14px; display: flex; gap: 12px; font-weight: 700; font-size: 14px">
<sc-for list="{{areas}}" as="a" hint-placeholder-count="6"><span style="background: #FFFFFF; padding: 8px 14px; border-radius: 999px">{{a}}</span></sc-for>
</div>
</div>

<section id="services" class="sec">
<div class="wrap" style="display: flex; flex-direction: column; gap: 40px">
<h2 class="h2" style="max-width: 720px">{{t.svcTitle}}</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px">
<sc-for list="{{services}}" as="item" hint-placeholder-count="6">
<article class="card" style="overflow: hidden; display: flex; flex-direction: column">
<img src="{{item.img}}" alt="{{item.title}}" style="width: 100%; height: 190px; object-fit: cover; display: block">
<div style="padding: 24px; display: flex; flex-direction: column; gap: 10px; flex-grow: 1">
<h3 style="margin: 0; font-size: 20px; font-weight: 700">{{item.title}}</h3>
<p class="lead" style="font-size: 16px">{{item.body}}</p>
<a href="#services" style="margin-top: auto; font-weight: 700; font-size: 15px">{{t.svcLink}} →</a>
</div>
</article>
</sc-for>
</div>
</div>
</section>

<section id="work" class="sec warm">
<div class="wrap" style="display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between"><h2 class="h2">{{t.workTitle}}</h2><a href="#work" style="font-weight: 700">{{t.workAll}} →</a></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 16px">
<sc-for list="{{work}}" as="w" hint-placeholder-count="6">
<a href="#work" style="position: relative; overflow: hidden; height: 300px; border-radius: 16px; text-decoration: none; display: flex; align-items: flex-end; padding: 16px; box-sizing: border-box">
<img src="{{w.img}}" alt="{{w.name}}" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: block">
<span style="position: relative; background: #FFFFFF; color: #161616; padding: 10px 14px; border-radius: 999px; font-weight: 700; font-size: 15px">{{w.name}}</span>
</a>
</sc-for>
</div>
</div>
</section>

<section id="about" class="sec ink">
<div class="wrap" style="display: flex; flex-wrap: wrap; gap: 48px; align-items: center">
<img src="images/crew-stone-fireplace.jpg" alt="Building Ideas crew installing a two-story stone fireplace" style="flex: 1 1 360px; min-width: 0; width: 100%; height: 540px; object-fit: cover; border-radius: 16px; display: block">
<div style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
<h2 class="h2">{{t.aboutTitle}}</h2>
<p class="lead" style="font-size: 18px">{{t.aboutBody}}</p>
<p style="margin: 0; font-size: 16px; color: #F5B3B7">{{t.aboutStory}}</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
<sc-for list="{{t.team}}" as="m" hint-placeholder-count="4"><div style="background: #242424; border-radius: 12px; padding: 14px"><div style="font-weight: 700">{{m.name}}</div><div style="font-size: 14px; color: #CFCFCF">{{m.role}}</div></div></sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{t.creds}}" as="c" hint-placeholder-count="4"><span style="border: 1px solid #4A4A4A; padding: 6px 12px; border-radius: 999px; font-size: 14px">{{c}}</span></sc-for></div>
</div>
</div>
</section>

<section id="area" class="sec">
<div class="wrap" style="display: flex; flex-wrap: wrap; gap: 40px; align-items: center">
<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<h2 class="h2">{{t.areaTitle}}</h2>
<p class="lead">{{t.areaBody}}</p>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{areas}}" as="a" hint-placeholder-count="6"><li><a href="#area" style="display: block; border: 1px solid #E4DFD8; padding: 10px 16px; border-radius: 999px; color: #161616; text-decoration: none; font-weight: 700">{{a}}</a></li></sc-for></ul>
<p style="margin: 0; font-size: 15px; color: #555555">{{t.areaRadius}}</p>
</div>
<div class="card" style="flex: 1 1 460px; min-width: 0; height: 380px; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; background-color: #F3F1EE; background-image: repeating-linear-gradient(0deg, rgba(22,22,22,0.06) 0 1px, transparent 1px 40px), repeating-linear-gradient(90deg, rgba(22,22,22,0.06) 0 1px, transparent 1px 40px); text-align: center; color: #444444; font-weight: 600">{{t.mapLabel}}</div>
</div>
</section>

<section aria-label="Reviews" class="sec warm">
<div class="wrap" style="display: flex; flex-direction: column; gap: 32px">
<h2 class="h2">{{t.revTitle}}</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px">
<sc-for list="{{reviews}}" as="r" hint-placeholder-count="3">
<figure style="margin: 0; background: #FFFFFF; border-radius: 16px; padding: 30px; display: flex; flex-direction: column; gap: 16px">
<blockquote style="margin: 0; font-size: 18px; line-height: 1.55; font-weight: 500">{{r.q}}</blockquote>
<figcaption style="display: flex; align-items: center; gap: 12px; font-weight: 700"><span style="width: 40px; height: 40px; border-radius: 50%; background: #8B1A1F; color: #FFFFFF; display: flex; align-items: center; justify-content: center">{{r.i}}</span>{{r.who}}</figcaption>
</figure>
</sc-for>
</div>
<a href="#top" style="font-weight: 700">{{t.revNote}} →</a>
</div>
</section>

<section id="plans" class="sec">
<div class="wrap" style="display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-direction: column; gap: 10px; max-width: 680px"><h2 class="h2">{{t.plansTitle}}</h2><p class="lead">{{t.plansSub}}</p></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px">
<sc-for list="{{plans}}" as="p" hint-placeholder-count="3">
<article style="{{p.box}}">
<sc-if value="{{p.featured}}" hint-placeholder-val="{{false}}"><span style="align-self: flex-start; background: #FFFFFF; color: #8B1A1F; font-size: 12px; font-weight: 800; padding: 6px 10px; border-radius: 999px">{{t.featLabel}}</span></sc-if>
<h3 style="margin: 0; font-size: 22px; font-weight: 800">{{p.name}}</h3>
<div style="font-size: 32px; font-weight: 800">{{p.price}}</div>
<p style="margin: 0; font-size: 16px; line-height: 1.55">{{p.body}}</p>
<ul style="margin: 0; padding-left: 20px; font-size: 15px; line-height: 1.8"><sc-for list="{{p.points}}" as="pt" hint-placeholder-count="3"><li>{{pt}}</li></sc-for></ul>
<a href="#contact" style="{{p.btn}}">{{p.cta}}</a>
</article>
</sc-for>
</div>
<p style="margin: 0; font-size: 14px; color: #555555">{{t.plansNote}}</p>
</div>
</section>

<section aria-label="Free guide" class="ink">
<div class="wrap" style="padding-top: 56px; padding-bottom: 56px; display: flex; flex-wrap: wrap; gap: 24px 40px; align-items: center; justify-content: space-between">
<div style="display: flex; gap: 24px; align-items: center; flex: 1 1 520px; min-width: 0">
<div style="width: 96px; height: 124px; flex-shrink: 0; background: #8B1A1F; border-radius: 10px; display: flex; align-items: flex-end; padding: 10px; box-sizing: border-box; font-size: 12px; font-weight: 800; line-height: 1.2">{{t.magTitle}}</div>
<div style="display: flex; flex-direction: column; gap: 8px"><h2 style="margin: 0; font-size: 26px; font-weight: 800">{{t.magTitle}}</h2><p class="lead" style="font-size: 16px">{{t.magBody}}</p><span style="font-size: 13px; color: #F5B3B7">{{t.magNote}}</span></div>
</div>
<a href="#top" class="btn">{{t.magCta}}</a>
</div>
</section>

<section aria-label="Questions" class="sec">
<div class="wrap" style="display: flex; flex-wrap: wrap; gap: 40px">
<h2 class="h2" style="flex: 1 1 320px; min-width: 0">{{t.faqTitle}}</h2>
<div style="flex: 2 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{t.faq}}" as="f" hint-placeholder-count="5"><details style="background: #F3F1EE; border-radius: 14px; padding: 0 22px"><summary>{{f.q}}</summary><p class="lead" style="padding-bottom: 20px">{{f.a}}</p></details></sc-for>
</div>
</div>
</section>

<section aria-label="Tips" class="sec warm">
<div class="wrap" style="display: flex; flex-direction: column; gap: 28px">
<h2 class="h2">{{t.blogTitle}}</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px">
<sc-for list="{{blog}}" as="b" hint-placeholder-count="3">
<a href="#top" class="card" style="text-decoration: none; color: #161616; overflow: hidden; display: flex; flex-direction: column">
<img src="{{b.img}}" alt="{{b.title}}" style="width: 100%; height: 180px; object-fit: cover; display: block">
<span style="padding: 20px; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; font-weight: 800; color: #8B1A1F">{{b.tag}}</span><span style="font-size: 18px; font-weight: 700; line-height: 1.35">{{b.title}}</span></span>
</a>
</sc-for>
</div>
<p style="margin: 0; font-size: 14px; color: #555555">{{t.blogNote}}</p>
</div>
</section>

<section id="contact" class="sec">
<div class="wrap" style="display: flex; flex-wrap: wrap; gap: 48px">
<div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
<h2 class="h2" style="font-size: 44px">{{t.ctaA}} <span style="color: #8B1A1F">{{t.ctaB}}</span></h2>
<p class="lead" style="font-size: 18px">{{t.ctaSub}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px"><a href="tel:+14047719004" class="btn">{{t.ctaCall}}</a><a href="sms:+14047719004" class="btn" style="background: #161616">{{t.ctaText}}</a></div>
</div>
<form style="flex: 1 1 520px; min-width: 0; background: #8B1A1F; color: #FFFFFF; border-radius: 20px; padding: 36px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px">
<label class="lab">{{t.fName}}<input type="text" class="in"></label>
<label class="lab">{{t.fPhone}}<input type="tel" class="in"></label>
<label class="lab">{{t.fEmail}}<input type="email" class="in"></label>
<label class="lab">{{t.fType}}<select class="in" data-options="t.types"></select></label>
<label class="lab" style="grid-column: 1 / -1">{{t.fMsg}}<textarea rows="4" class="in"></textarea></label>
<button type="button" style="grid-column: 1 / -1; background: #FFFFFF; color: #8B1A1F; border: 0; padding: 17px; border-radius: 999px; font-weight: 800; font-size: 16px; cursor: pointer">{{t.fSend}}</button>
</form>
</div>
</section>

<footer class="ink" style="font-size: 15px; color: #CFCFCF">
<div class="wrap" style="padding-top: 48px; padding-bottom: 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 28px">
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-weight: 800; color: #FFFFFF; font-size: 17px">BUILDING IDEAS INC.</span><span>6600 Ganton Dr</span><span>Johns Creek, GA 30097</span><a href="tel:+14047719004" style="color: #FFFFFF">404-771-9004</a><a href="mailto:buildingideasremodeling@gmail.com" style="color: #FFFFFF">buildingideasremodeling@gmail.com</a></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="color: #FFFFFF; font-weight: 700">{{t.hoursLabel}}</span><span>{{t.hours}}</span><a href="#top" style="color: #FFFFFF">{{t.gbp}}</a></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="color: #FFFFFF; font-weight: 700">{{t.linksLabel}}</span><a href="#services" style="color: #CFCFCF">{{t.navServices}}</a><a href="#work" style="color: #CFCFCF">{{t.navWork}}</a><a href="#about" style="color: #CFCFCF">{{t.navAbout}}</a><a href="#area" style="color: #CFCFCF">{{t.navArea}}</a></div>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="color: #FFFFFF; font-weight: 700">{{t.credLabel}}</span><sc-for list="{{t.creds}}" as="c" hint-placeholder-count="4"><span>{{c}}</span></sc-for></div>
</div>
<div class="wrap" style="padding-top: 16px; padding-bottom: 28px; border-top: 1px solid #333333; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; font-size: 13px"><span>© 2026 Building Ideas Inc. · {{t.footLine}}</span><span>{{t.legal}}</span></div>
</footer>

</div>
</script>
